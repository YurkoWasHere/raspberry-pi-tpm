<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Raspberry Pi 3 measured boot chain</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/>
    </marker>
  </defs>

  <!-- light panel so the diagram reads the same in GitHub light and dark themes -->
  <rect x="1" y="1" width="958" height="468" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <!-- stages -->
  <g font-size="15">
    <rect x="30" y="34" width="190" height="78" rx="10" fill="#eaeef2" stroke="#8c959f" stroke-width="1.5"/>
    <text x="125" y="66" text-anchor="middle" font-weight="600" fill="#1f2328">Boot ROM</text>
    <text x="125" y="88" text-anchor="middle" font-size="12.5" fill="#57606a">in the SoC, immutable</text>

    <rect x="270" y="34" width="190" height="78" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
    <text x="365" y="62" text-anchor="middle" font-weight="600" fill="#0a3069">bootcode.bin</text>
    <text x="365" y="82" text-anchor="middle" font-size="12.5" fill="#0a3069">+ measuring payload</text>
    <text x="365" y="100" text-anchor="middle" font-size="11.5" fill="#57606a">stage 1</text>

    <rect x="510" y="34" width="190" height="78" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
    <text x="605" y="62" text-anchor="middle" font-weight="600" fill="#0a3069">start.elf</text>
    <text x="605" y="82" text-anchor="middle" font-size="12.5" fill="#0a3069">hooked in RAM</text>
    <text x="605" y="100" text-anchor="middle" font-size="11.5" fill="#57606a">stage 2</text>

    <rect x="750" y="34" width="180" height="78" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
    <text x="840" y="66" text-anchor="middle" font-weight="600" fill="#0f3d1f">Linux</text>
    <text x="840" y="88" text-anchor="middle" font-size="12.5" fill="#0f3d1f">tpm2_eventlog replays</text>
  </g>
  <g stroke="#57606a" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="220" y1="73" x2="266" y2="73"/>
    <line x1="460" y1="73" x2="506" y2="73"/>
    <line x1="700" y1="73" x2="746" y2="73"/>
  </g>

  <!-- what each stage measures -->
  <g font-size="13.5" fill="#1f2328">
    <rect x="270" y="140" width="190" height="112" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="284" y="166">config.txt</text><text x="446" y="166" text-anchor="end" font-weight="600" fill="#9a6700">PCR 1</text>
    <text x="284" y="194">start.elf</text><text x="446" y="194" text-anchor="end" font-weight="600" fill="#9a6700">PCR 0</text>
    <text x="284" y="222">fixup.dat</text><text x="446" y="222" text-anchor="end" font-weight="600" fill="#9a6700">PCR 0</text>
    <text x="365" y="244" text-anchor="middle" font-size="11" fill="#57606a">hashed on VPU, extended via SPI</text>

    <rect x="510" y="140" width="190" height="112" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="524" y="166">base .dtb</text><text x="686" y="166" text-anchor="end" font-weight="600" fill="#9a6700">PCR 5</text>
    <text x="524" y="194">kernel8.img</text><text x="686" y="194" text-anchor="end" font-weight="600" fill="#9a6700">PCR 4</text>
    <text x="524" y="222">final device tree</text><text x="686" y="222" text-anchor="end" font-weight="600" fill="#9a6700">PCR 5</text>
    <text x="605" y="244" text-anchor="middle" font-size="11.5" fill="#57606a">overlays · dtparams · cmdline</text>
  </g>
  <g stroke="#8c959f" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="365" y1="112" x2="365" y2="140"/>
    <line x1="605" y1="112" x2="605" y2="140"/>
  </g>

  <!-- TPM -->
  <rect x="270" y="318" width="430" height="110" rx="12" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/>
  <text x="485" y="346" text-anchor="middle" font-size="15" font-weight="600" fill="#4d2d00">Infineon SLB9670 TPM 2.0 · SPI0 CE1</text>
  <g font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">
    <rect x="300" y="362" width="80" height="30" rx="6" fill="#9a6700"/><text x="340" y="382">PCR 0</text>
    <rect x="395" y="362" width="80" height="30" rx="6" fill="#9a6700"/><text x="435" y="382">PCR 1</text>
    <rect x="490" y="362" width="80" height="30" rx="6" fill="#9a6700"/><text x="530" y="382">PCR 4</text>
    <rect x="585" y="362" width="80" height="30" rx="6" fill="#9a6700"/><text x="625" y="382">PCR 5</text>
  </g>
  <text x="485" y="416" text-anchor="middle" font-size="11.5" fill="#6b4a00">sha1 + sha256 banks · reset each boot via RST# (GPIO 4)</text>
  <g stroke="#9a6700" stroke-width="2" fill="none" marker-end="url(#arrT)">
    <line x1="365" y1="252" x2="365" y2="314"/>
    <line x1="605" y1="252" x2="605" y2="314"/>
  </g>

  <!-- event log -->
  <rect x="750" y="160" width="180" height="92" rx="8" fill="#f6f8fa" stroke="#1a7f37" stroke-dasharray="5 4"/>
  <text x="840" y="186" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f3d1f">TCG event log</text>
  <text x="840" y="206" text-anchor="middle" font-size="12" fill="#1f2328">reserved RAM 0x0F000000</text>
  <text x="840" y="226" text-anchor="middle" font-size="12" fill="#1f2328">binary_bios_measurements</text>
  <text x="840" y="244" text-anchor="middle" font-size="11.5" fill="#57606a">replay = live PCRs</text>
  <g stroke="#1a7f37" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M700 196 L746 196"/>
    <line x1="840" y1="160" x2="840" y2="116"/>
  </g>

  <text x="30" y="300" font-size="12" fill="#57606a">start.elf and fixup.dat stay stock</text>
  <text x="30" y="318" font-size="12" fill="#57606a">on disk; start.elf is hooked only</text>
  <text x="30" y="336" font-size="12" fill="#57606a">in RAM. bootcode.bin gets one</text>
  <text x="30" y="354" font-size="12" fill="#57606a">hooked call + appended payload.</text>
</svg>
